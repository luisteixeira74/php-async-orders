services:
  app:
    build: .
    container_name: php-async-orders-app
    volumes:
      - .:/var/www
    depends_on:
      - postgres
    env_file:
      - .env

  postgres:
    image: postgres:16
    container_name: php-async-orders-db
    restart: always
    environment:
      POSTGRES_DB: async_orders
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:

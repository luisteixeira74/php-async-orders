services:
  app:
    build: .
    container_name: php-async-orders-app
    volumes:
      - .:/var/www
    depends_on:
      - postgres
    env_file:
      - .env
    ports:
      - "8000:8000"

  postgres:
    image: postgres:16
    container_name: php-async-orders-db
    restart: always
    environment:
      POSTGRES_DB: async_orders
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: php-async-orders-rabbit
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

volumes:
  pgdata:
